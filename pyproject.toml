[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framebyframe-aswaxs"
version = "6.0.0"
description = "FrameByFrame-ASWAXS GUI platform for SAXS, WAXS, and ASAXS reduction"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fabio",
    "h5py",
    "matplotlib",
    "numpy>=2.1,<2.4",
    "pyFAI",
    "qtawesome",
    "pyqtgraph",
    "pyzmq",
    "PySide6>=6.8,<6.9",
    "kafka-python",
    "bluesky-kafka",
]

[project.scripts]
FrameByFrame = "aswaxs_live.app.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
